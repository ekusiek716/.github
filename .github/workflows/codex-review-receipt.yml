name: Reusable Codex Review Receipt

on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: Maximum time to wait for a Codex receipt (1-20)
        required: false
        type: number
        default: 15
      poll_interval_seconds:
        description: Delay between GitHub receipt checks (10-60)
        required: false
        type: number
        default: 30

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codex-review-receipt-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wait-for-review:
    name: Codex review activity receipt
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Wait for current-head Codex review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RECEIPT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          RECEIPT_POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("This reusable workflow requires a pull_request event.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = pr.number;
            const expectedHead = pr.head.sha;
            const eventUpdatedAt = Date.parse(pr.updated_at);
            const receiptCutoff = Number.isFinite(eventUpdatedAt)
              ? eventUpdatedAt
              : Date.now();
            const timeoutMinutes = Math.min(
              20,
              Math.max(
                1,
                Number(process.env.RECEIPT_TIMEOUT_MINUTES || "15"),
              ),
            );
            const pollSeconds = Math.min(
              60,
              Math.max(
                10,
                Number(process.env.RECEIPT_POLL_INTERVAL_SECONDS || "30"),
              ),
            );
            const deadline = Date.now() + timeoutMinutes * 60 * 1000;

            const isCodex = (login) =>
              String(login || "")
                .toLowerCase()
                .replace(/\[bot\]$/, "") === "chatgpt-codex-connector";

            const reviewedCommitFromCompletion = (comment) => {
              if (!isCodex(comment.user?.login)) {
                return null;
              }
              const body = String(comment.body || "");
              if (!/didn't find any major issues/i.test(body)) {
                return null;
              }
              const match = body.match(
                /(?:\*\*)?Reviewed commit:(?:\*\*)?\s*`([0-9a-f]{10,40})`/i,
              );
              return match?.[1]?.toLowerCase() ?? null;
            };

            const permissionCache = new Map();
            const canAdjudicate = async (login) => {
              const normalized = String(login || "");
              if (!normalized || /\[bot\]$/i.test(normalized) || isCodex(normalized)) {
                return false;
              }
              if (!permissionCache.has(normalized)) {
                const permission = await github.rest.repos
                  .getCollaboratorPermissionLevel({
                    owner,
                    repo,
                    username: normalized,
                  })
                  .then(({ data }) => data.permission)
                  .catch(() => "none");
                permissionCache.set(normalized, permission);
              }
              return ["write", "maintain", "admin"].includes(
                permissionCache.get(normalized),
              );
            };

            const findingAdjudication = async (finding) => {
              const reactions = await github.paginate(
                github.rest.reactions.listForPullRequestReviewComment,
                {
                  owner,
                  repo,
                  comment_id: finding.id,
                  per_page: 100,
                  headers: {
                    accept: "application/vnd.github+json",
                  },
                },
              );
              for (const reaction of reactions
                .filter((candidate) => candidate.content === "-1")
                .sort(
                  (a, b) =>
                    Date.parse(b.created_at || "0") -
                    Date.parse(a.created_at || "0"),
                )) {
                if (await canAdjudicate(reaction.user?.login)) {
                  return reaction;
                }
              }
              return null;
            };

            const escapeHtml = (value) =>
              String(value ?? "")
                .replace(/[\r\n]+/g, " ")
                .replace(
                  /[&<>"']/g,
                  (character) =>
                    ({
                      "&": "&amp;",
                      "<": "&lt;",
                      ">": "&gt;",
                      '"': "&quot;",
                      "'": "&#39;",
                    })[character],
                );

            const writeSummary = async (heading, lines) => {
              core.summary.addHeading(heading, 2);
              core.summary.addRaw(lines.join("\n") + "\n");
              await core.summary.write();
            };

            const requireExpectedHead = async () => {
              const { data: latestPr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });
              if (latestPr.head.sha === expectedHead) {
                return true;
              }

              await writeSummary("Pull request HEAD changed", [
                "- Repository: `" + owner + "/" + repo + "`",
                "- Pull request: [#" + pullNumber + "](" + pr.html_url + ")",
                "- HEAD at workflow trigger: `" + expectedHead + "`",
                "- Current HEAD: `" + latestPr.head.sha + "`",
                "- Result: this run cannot receipt the newer revision",
              ]);
              core.setFailed(
                "The pull request HEAD changed while waiting for Codex.",
              );
              return false;
            };

            core.info("Repository: " + owner + "/" + repo);
            core.info("Pull request: #" + pullNumber);
            core.info("Expected HEAD: " + expectedHead);
            core.info("Receipt cutoff: " + new Date(receiptCutoff).toISOString());

            while (Date.now() <= deadline) {
              if (!(await requireExpectedHead())) {
                return;
              }

              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                {
                  owner,
                  repo,
                  pull_number: pullNumber,
                  per_page: 100,
                },
              );
              const currentReview = reviews
                .filter(
                  (review) =>
                    isCodex(review.user?.login) &&
                    review.commit_id === expectedHead,
                )
                .sort(
                  (a, b) =>
                    Date.parse(b.submitted_at || "0") -
                    Date.parse(a.submitted_at || "0"),
                )[0];

              if (currentReview) {
                const reviewComments = await github.paginate(
                  github.rest.pulls.listReviewComments,
                  {
                    owner,
                    repo,
                    pull_number: pullNumber,
                    per_page: 100,
                  },
                );
                const currentFindings = reviewComments.filter(
                  (comment) =>
                    isCodex(comment.user?.login) &&
                    comment.pull_request_review_id === currentReview.id,
                );

                const receiptLines = [
                  "- Repository: `" + owner + "/" + repo + "`",
                  "- Pull request: [#" + pullNumber + "](" + pr.html_url + ")",
                  "- Reviewed HEAD: `" + expectedHead + "`",
                  "- Receipt: GitHub pull request review",
                  "- Submitted: " + (currentReview.submitted_at || "unknown"),
                ];

                if (currentFindings.length > 0) {
                  const findings = await Promise.all(
                    currentFindings.map(async (finding) => ({
                      finding,
                      adjudication: await findingAdjudication(finding),
                    })),
                  );
                  const blockingFindings = findings.filter(
                    ({ adjudication }) => !adjudication,
                  );
                  receiptLines.push(
                    "- Result: " +
                      blockingFindings.length +
                      " blocking / " +
                      currentFindings.length +
                      " total Codex inline finding(s)",
                  );
                  for (const { finding, adjudication } of findings) {
                    const line =
                      finding.line ?? finding.original_line ?? "unknown";
                    receiptLines.push(
                      '  - <a href="' +
                        escapeHtml(finding.html_url) +
                        '"><code>' +
                        escapeHtml(finding.path) +
                        ":" +
                        escapeHtml(line) +
                        "</code></a>" +
                        (adjudication
                          ? " — maintainer-disputed by @" +
                            escapeHtml(adjudication.user?.login)
                          : " — blocking"),
                    );
                  }
                  if (blockingFindings.length > 0) {
                    await writeSummary(
                      "Codex review completed with blocking findings",
                      receiptLines,
                    );
                    core.setFailed(
                      "Codex reviewed the current HEAD and posted " +
                        blockingFindings.length +
                        " non-adjudicated inline finding(s).",
                    );
                    return;
                  }

                  await writeSummary(
                    "Codex review findings adjudicated",
                    receiptLines,
                  );
                  if (!(await requireExpectedHead())) {
                    return;
                  }
                  core.info(
                    "All current-head Codex findings were disputed by a maintainer.",
                  );
                  return;
                }

                receiptLines.push("- Result: no inline findings");
                await writeSummary("Codex review receipt verified", receiptLines);
                if (!(await requireExpectedHead())) {
                  return;
                }
                core.info("Verified Codex review for current HEAD.");
                return;
              }

              const issueComments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: pullNumber,
                  per_page: 100,
                },
              );
              const completionComment = issueComments
                .map((comment) => ({
                  comment,
                  reviewedCommit: reviewedCommitFromCompletion(comment),
                }))
                .filter(
                  ({ comment, reviewedCommit }) =>
                    reviewedCommit &&
                    expectedHead.toLowerCase().startsWith(reviewedCommit) &&
                    Date.parse(comment.created_at || "0") > receiptCutoff,
                )
                .sort(
                  (a, b) =>
                    Date.parse(b.comment.created_at || "0") -
                    Date.parse(a.comment.created_at || "0"),
                )[0];

              if (completionComment) {
                await writeSummary("Codex completion comment verified", [
                  "- Repository: `" + owner + "/" + repo + "`",
                  "- Pull request: [#" + pullNumber + "](" + pr.html_url + ")",
                  "- HEAD at workflow trigger: `" + expectedHead + "`",
                  "- Reviewed commit prefix: `" +
                    completionComment.reviewedCommit +
                    "`",
                  "- Receipt: Codex no-major-issues completion comment",
                  "- Received: " + completionComment.comment.created_at,
                ]);
                if (!(await requireExpectedHead())) {
                  return;
                }
                core.info("Verified SHA-bound Codex completion comment.");
                return;
              }

              const reactions = await github.paginate(
                github.rest.reactions.listForIssue,
                {
                  owner,
                  repo,
                  issue_number: pullNumber,
                  per_page: 100,
                  headers: {
                    accept: "application/vnd.github+json",
                  },
                },
              );
              const approvalReaction = reactions
                .filter(
                  (reaction) =>
                    isCodex(reaction.user?.login) &&
                    reaction.content === "+1" &&
                    Date.parse(reaction.created_at || "0") > receiptCutoff,
                )
                .sort(
                  (a, b) =>
                    Date.parse(b.created_at || "0") -
                    Date.parse(a.created_at || "0"),
                )[0];

              if (approvalReaction) {
                await writeSummary("Codex PR activity receipt recorded", [
                  "- Repository: `" + owner + "/" + repo + "`",
                  "- Pull request: [#" + pullNumber + "](" + pr.html_url + ")",
                  "- HEAD at workflow trigger: `" + expectedHead + "`",
                  "- Receipt: fresh Codex 👍 reaction on the pull request",
                  "- Received: " + approvalReaction.created_at,
                  "- Result: no findings were posted before this receipt",
                  "- Scope: PR reactions do not identify a commit SHA",
                ]);
                if (!(await requireExpectedHead())) {
                  return;
                }
                core.info("Recorded a fresh PR-level Codex thumbs-up receipt.");
                return;
              }

              const freshEyes = reactions.some(
                (reaction) =>
                  isCodex(reaction.user?.login) &&
                  reaction.content === "eyes" &&
                  Date.parse(reaction.created_at || "0") > receiptCutoff,
              );
              core.info(
                "No current-head receipt yet. Codex processing signal: " +
                  (freshEyes ? "seen" : "not seen"),
              );

              await new Promise((resolve) =>
                setTimeout(resolve, pollSeconds * 1000),
              );
            }

            await writeSummary("Codex review receipt missing", [
              "- Repository: `" + owner + "/" + repo + "`",
              "- Pull request: [#" + pullNumber + "](" + pr.html_url + ")",
              "- HEAD at workflow trigger: `" + expectedHead + "`",
              "- Waited: " + timeoutMinutes + " minute(s)",
              "- Result: no SHA-bound Codex review or fresh PR-level 👍 was observed",
            ]);
            core.setFailed(
              "Timed out waiting for Codex activity for this PR event.",
            );
